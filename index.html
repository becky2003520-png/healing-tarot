<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>療癒塔羅占卜小屋</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Serif TC",serif;color:#4b3829}body{background:#2d221b}.app{width:100%;margin:auto}.page{display:none;position:relative}.page.active{display:block}.paper{background:#fff4dfec;border:2px solid #b89568;border-radius:22px;padding:22px;box-shadow:0 10px 28px #34231955}.title{text-align:center;font-size:clamp(30px,5vw,52px);font-weight:800}.btn{border:2px solid #8d744e;background:#657255;color:#fff9eb;border-radius:999px;padding:14px 30px;font-size:20px;font-weight:700;cursor:pointer;display:block;margin:22px auto;box-shadow:0 6px 0 #454d39}.btn:disabled{opacity:.38;cursor:not-allowed}.lead,.home-note{text-align:center}#home,#draw,#spread{width:100%;aspect-ratio:3/2;min-height:0;overflow:hidden;background-position:center top;background-size:100% 100%;background-repeat:no-repeat}#home{background-image:url('tarot-home-bg.png')}.home-panel{position:absolute;right:3.5%;top:50%;transform:translateY(-50%);width:min(390px,34vw);padding:24px 22px 20px;background:#f7e8cfee;border:2px solid #b99061;border-radius:26px;box-shadow:0 16px 38px #26180e6b}.home-panel h2{text-align:center;margin:0;font-size:28px}.choices{display:grid;gap:10px}.choice{width:100%;padding:12px 18px;background:#f7e7cf;border:2px solid #c29f74;border-radius:999px;font-size:20px;color:#4b3829;cursor:pointer;display:flex;align-items:center;gap:13px}.choice.on{background:#d9d3ae;border-color:#7d805c}.choice span{font-size:27px;width:34px}.check{margin-left:auto;opacity:0}.choice.on .check{opacity:1}.home-panel .btn{width:100%;margin:18px 0 8px}#draw{background-image:url('tarot-home-P1.png');padding:0}#draw .paper{position:absolute;left:31%;right:31%;top:15%;z-index:6;background:transparent;border:0;box-shadow:none;padding:0}#draw .hint{text-align:center;font-size:clamp(14px,1.45vw,22px);font-weight:700;min-height:1.5em}.felt{position:absolute;left:9%;right:9%;top:30%;bottom:8%;z-index:2}.deck{position:absolute;left:50%;bottom:17%;width:0;height:0}.card,.backcard{border:3px solid #d6b778;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455;position:absolute}.card:after,.backcard:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:25px}.card{width:clamp(42px,5vw,76px);height:clamp(70px,8.2vw,124px);left:clamp(-38px,-2.5vw,-21px);bottom:0;transform-origin:50% 100%;cursor:pointer}.used{opacity:.22;pointer-events:none}.chosen{position:absolute;z-index:5;width:clamp(66px,7.1vw,109px);aspect-ratio:2/3;display:none;filter:drop-shadow(0 6px 5px #25180e66)}.chosen.show{display:block}.chosen .backcard{inset:0}.chosen .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-1.7em;white-space:nowrap;color:#fff4df;font-weight:800;font-size:clamp(13px,1.35vw,20px);text-shadow:0 2px 4px #24160f}.chosen.past{left:31%;top:31%;transform:translateX(-50%) rotate(-3deg)}.chosen.future{left:69%;top:31%;transform:translateX(-50%) rotate(3deg)}.chosen.now{left:50%;top:43%;transform:translateX(-50%)}#draw>#next{position:absolute;z-index:7;left:50%;bottom:2.2%;transform:translateX(-50%);margin:0;padding:10px 28px;font-size:clamp(14px,1.5vw,20px)}#spread{background-image:url('tarot-home-P2.png');padding:0}#spread>.paper{position:absolute;inset:0;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0}#spread .title{position:absolute;left:0;right:0;top:12%;z-index:4;font-size:clamp(15px,2.5vw,26px)}.spread{width:54%;height:58%;margin:0;position:absolute;left:23%;top:24%;z-index:3}.slot{position:absolute;width:clamp(62px,7vw,108px);aspect-ratio:2/3;border:3px solid #d8b878;border-radius:8px;background:#20364b center/cover no-repeat;box-shadow:0 6px 14px #24160f66}.slot .backcard{display:none}.slot.past{left:18%;top:5%}.slot.future{right:18%;top:5%}.slot.now{left:50%;top:45%;transform:translateX(-50%)}.lab{position:absolute;background:#fff1d9;border:1px solid #c7a778;border-radius:999px;padding:6px 10px}.lab.past{left:17%;top:45%}.lab.future{right:17%;top:45%}.lab.now{left:50%;top:88%;transform:translateX(-50%)}#spread #finish{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);margin:0;z-index:5}#result,#night{min-height:100vh;padding:24px;background:linear-gradient(#f8ecd7,#ead5b7)}.resultcards{display:flex;justify-content:center;gap:55px;margin:25px}.mini{width:110px;aspect-ratio:2/3;border:3px solid #d8b878;border-radius:8px;background:#20364b center/cover no-repeat}.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.read{background:#fff7e8;border:1px solid #c9a97f;border-radius:16px;padding:14px;line-height:1.7}#night{background:linear-gradient(#26334a,#596270 70%,#8b7258)}#night .paper{background:#29364acc;color:#fff8e8;text-align:center;margin-top:18vh}.side{position:absolute;right:16px;top:45%;display:grid;gap:10px}@media(max-width:850px){.home-panel{bottom:3%;top:auto;left:6%;right:6%;transform:none;width:auto;padding:14px}.choices{grid-template-columns:1fr 1fr}.choice{font-size:14px;padding:7px 10px}.home-panel h2{font-size:18px}.home-panel .lead,.home-note{font-size:11px}.home-panel .btn{font-size:16px;padding:9px;margin:8px 0}.reads{grid-template-columns:1fr}}</style></head><body><main class="app"><section id="home" class="page active"><div class="home-panel"><h2>請選擇你想占卜的主題</h2><div class="lead">— 讓塔羅為你指引方向 —</div><div class="choices"><button class="choice" data-cat="愛情"><span>♡</span>愛情<b class="check">✓</b></button><button class="choice" data-cat="工作"><span>💼</span>工作<b class="check">✓</b></button><button class="choice" data-cat="學業"><span>📖</span>學業<b class="check">✓</b></button><button class="choice" data-cat="健康"><span>🌱</span>健康<b class="check">✓</b></button><button class="choice" data-cat="人格特質"><span>★</span>人格特質<b class="check">✓</b></button></div><button id="start" class="btn" disabled>前往占卜 →</button><div class="home-note">選擇一個主題，開啟屬於你的指引吧 ♡</div></div></section><section id="draw" class="page"><div class="paper"><div id="hint" class="hint">第 1 張代表「現在」</div></div><div id="pastCard" class="chosen past"><div class="backcard"></div><div class="tag">過去</div></div><div id="futureCard" class="chosen future"><div class="backcard"></div><div class="tag">未來</div></div><div id="nowCard" class="chosen now"><div class="backcard"></div><div class="tag">現在</div></div><div class="felt"><div id="deck" class="deck"></div></div><button id="next" class="btn" disabled>選牌完成</button></section><section id="spread" class="page"><div class="paper"><div class="title">聖三角占卜法</div><div class="spread"><div class="slot past"><div class="backcard"></div></div><div class="slot future"><div class="backcard"></div></div><div class="slot now"><div class="backcard"></div></div><div class="lab past">過去</div><div class="lab future">未來</div><div class="lab now">現在</div></div><button id="finish" class="btn">牌面解析</button></div></section><section id="result" class="page"><div class="paper"><div class="title">占卜結果 ✦</div><div id="outcat" style="text-align:center"></div><div class="resultcards"><div><div class="mini"></div><div id="n0"></div></div><div><div class="mini"></div><div id="n1"></div></div><div><div class="mini"></div><div id="n2"></div></div></div><div class="reads"><article class="read"><b>過去</b><p id="t0"></p></article><article class="read"><b>現在</b><p id="t1"></p></article><article class="read"><b>未來</b><p id="t2"></p></article></div><button id="close" class="btn">查看療癒訊息</button></div></section><section id="night" class="page"><div class="paper"><h1>願這次的占卜，成為溫柔的提醒</h1><p>塔羅牌不是預言，而是陪你看見內心的方向。<br>願你在每一次的選擇裡，都更靠近自己想要的生活。</p></div><div class="side"><button id="again">↻ 再占一次</button><button id="tohome">⌂ 回到首頁</button><button id="share">⌯ 分享結果</button></div></section></main><script>const cards=['愚者','魔術師','女祭司','皇后','皇帝','教皇','戀人','戰車','力量','隱者','命運之輪','正義','倒吊人','死神','節制','惡魔','高塔','星星','月亮','太陽','審判','世界'];const tx={愛情:['過去的感情經驗讓你更了解自己的需求與界線。','現在適合誠實面對內心，讓關係回到真誠與自在。','未來有新的可能靠近，保持開放並相信自己的感受。'],工作:['過去累積的經驗正在成為你的專業與底氣。','現在適合整理目標，把能力用在真正想投入的方向。','未來有新的合作或發展機會，持續行動會帶來改變。'],學業:['過去的學習經驗已經替你打下重要基礎。','現在適合專注核心目標，找到自己的學習節奏。','未來會逐步看見成果，持續累積就是你的力量。'],健康:['過去的生活節奏可能讓你忽略休息與內在感受。','現在最重要的是重新找回平衡，照顧睡眠與日常節奏。','未來適合建立穩定習慣，慢慢累積身心力量。'],人格特質:['過去的經驗形成了你獨特的處事方式與能力。','現在需要更相信自己的直覺與判斷。','未來會越來越清楚自己的價值，並把特質化為力量。']};let cat='',p=[];const $=x=>document.getElementById(x),img=i=>`tarot-card_${String(i).padStart(2,'0')}.png`;function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active');scrollTo(0,0)}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;$('start').disabled=false});function resetChosen(){['pastCard','nowCard','futureCard'].forEach(x=>$(x).classList.remove('show'))}function deck(){let d=$('deck');d.innerHTML='';for(let i=0;i<22;i++){let b=document.createElement('button');b.className='card';let a=-48+i*96/21,x=(i-10.5)*30,y=Math.abs(i-10.5)*1.2;b.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${a}deg)`;b.style.zIndex=i;b.onclick=()=>pick(i,b);d.appendChild(b)}}function pick(i,b){if(p.includes(i)||p.length===3)return;p.push(i);b.classList.add('used');let target=p.length===1?'nowCard':p.length===2?'pastCard':'futureCard';$(target).classList.add('show');$('hint').textContent=p.length===1?'第 2 張代表「過去」':p.length===2?'第 3 張代表「未來」':'';$('next').disabled=p.length!==3}$('start').onclick=()=>{p=[];resetChosen();deck();$('hint').textContent='第 1 張代表「現在」';$('next').disabled=true;show('draw')};$('next').onclick=()=>{let order=[p[1],p[0],p[2]];document.querySelectorAll('#spread .slot').forEach((s,i)=>s.style.backgroundImage=`url('${img(order[i])}')`);show('spread')};$('finish').onclick=()=>{let order=[p[1],p[0],p[2]];document.querySelectorAll('.mini').forEach((m,i)=>m.style.backgroundImage=`url('${img(order[i])}')`);order.forEach((v,i)=>$('n'+i).textContent=cards[v]);tx[cat].forEach((v,i)=>$('t'+i).textContent=v);$('outcat').textContent='「'+cat+'」的聖三角指引';show('result')};$('close').onclick=()=>show('night');$('again').onclick=()=>show('home');$('tohome').onclick=()=>show('home');$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('已複製遊戲網址！')}catch(e){alert('請複製瀏覽器網址分享喔！')}};</script></body></html>
