<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>療癒塔羅占卜小屋</title><link rel="stylesheet" href="style-v2.css"></head><body><main class="app"><section id="home" class="page active"><div class="home-panel"><h2>請選擇你想占卜的主題</h2><div class="lead">— 讓塔羅為你指引方向 —</div><div class="choices"><button class="choice" data-cat="愛情"><span>♡</span>愛情<b class="check">✓</b></button><button class="choice" data-cat="工作"><span>💼</span>工作<b class="check">✓</b></button><button class="choice" data-cat="學業"><span>📖</span>學業<b class="check">✓</b></button><button class="choice" data-cat="健康"><span>🌱</span>健康<b class="check">✓</b></button><button class="choice" data-cat="人格特質"><span>★</span>人格特質<b class="check">✓</b></button><button class="choice" data-cat="財運"><span>💰</span>財運<b class="check">✓</b></button></div><button id="start" class="btn" disabled>前往占卜 →</button><div class="home-note">選擇一個主題，開啟屬於你的指引吧 ♡</div></div></section><section id="draw" class="page"><div class="paper"><div id="hint" class="hint">第 1 張代表「現在」</div></div><div id="pastCard" class="chosen past"><div class="backcard"></div><div class="tag">過去</div></div><div id="futureCard" class="chosen future"><div class="backcard"></div><div class="tag">未來</div></div><div id="nowCard" class="chosen now"><div class="backcard"></div><div class="tag">現在</div></div><div class="felt"><div id="deck" class="deck"></div></div><button id="next" class="btn" disabled>選牌完成</button></section><section id="spread" class="page"><div class="paper"><div class="title">聖三角占卜法</div><div class="spread"><div class="slot past"></div><div class="slot future"></div><div class="slot now"></div><div class="lab past">過去</div><div class="lab future">未來</div><div class="lab now">現在</div></div><button id="finish" class="btn">牌面解析</button></div></section><section id="result" class="page"><div class="paper"><div class="title">占卜結果 ✦</div><div id="outcat"></div><div class="resultcards"><div><div class="mini"></div><div id="n0"></div></div><div><div class="mini"></div><div id="n1"></div></div><div><div class="mini"></div><div id="n2"></div></div></div><div class="reads"><article class="read"><b>過去</b><p id="t0"></p></article><article class="read"><b>現在</b><p id="t1"></p></article><article class="read"><b>未來</b><p id="t2"></p></article></div><button id="close" class="btn">結束</button></div></section><section id="night" class="page"><div class="paper"><h1>願這次的占卜，成為溫柔的提醒</h1><p>塔羅牌不是預言，而是陪你看見內心的方向。<br>願你在每一次的選擇裡，都更靠近自己想要的生活。</p></div><div class="side"><button id="again">↻ 再占一次</button><button id="tohome">⌂ 回到首頁</button><button id="share">⌯ 分享結果</button></div></section></main><script src="app-v2.js"></script></body></html>
