<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>療癒塔羅占卜｜聖三角</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8d7bc;color:#4b3b31;font-family:"Noto Serif TC","Microsoft JhengHei",serif}
button{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px}.screen{min-height:720px;border:7px solid #f8eedc;border-radius:28px;overflow:hidden;position:relative;background:#f5e7d0;box-shadow:0 18px 45px #6b513633}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 5% 10%,#78915b66 0 7%,transparent 8%),radial-gradient(circle at 96% 88%,#78915b55 0 8%,transparent 9%),radial-gradient(circle at 2% 75%,#c9a56c55 0 4%,transparent 5%);pointer-events:none}.top{padding:34px 28px 22px;text-align:center;background:#f8ecd9dd;position:relative}h1{font-size:clamp(32px,5vw,56px);margin:0 0 7px;letter-spacing:.12em}.sub{font-size:16px;letter-spacing:.12em}.step{display:inline-block;background:#87664c;color:#fff8e9;border-radius:999px;padding:7px 18px;margin-bottom:13px;font-size:17px}.panel{position:relative;min-height:600px;padding:25px 35px;background:linear-gradient(#f7ead6ee,#f2dfc4ee)}.note{max-width:700px;margin:0 auto 22px;text-align:center;line-height:1.8}.felt{background:radial-gradient(circle,#b7aa72 1px,transparent 2px) 0 0/22px 22px,#526b58;border:10px solid #bca77d;border-radius:50% 50% 44% 44%;max-width:900px;height:360px;margin:10px auto 28px;position:relative;box-shadow:inset 0 0 0 2px #e4c78e55,0 10px 25px #44372a33}.stars{position:absolute;inset:0;color:#e9d49b;font-size:25px}.stars span{position:absolute}.stars span:nth-child(1){left:18%;top:35%}.stars span:nth-child(2){left:48%;top:45%;font-size:38px}.stars span:nth-child(3){right:18%;top:28%}.deck{position:absolute;left:50%;bottom:38px;width:0;height:0}.card{position:absolute;width:65px;height:106px;left:-32px;bottom:0;border:3px solid #d8b978;border-radius:8px;background:repeating-linear-gradient(45deg,#293d50 0 5px,#30475b 5px 10px);box-shadow:0 7px 12px #25201655;cursor:pointer;transform-origin:50% 100%;transition:.2s}.card:after{content:"✦";color:#e0c47d;position:absolute;inset:8px;border:1px solid #d8b978;border-radius:5px;display:grid;place-items:center;font-size:25px}.card:hover{filter:brightness(1.2);margin-bottom:8px}.card.used{opacity:.18;pointer-events:none}.cats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.cat{min-width:135px;padding:17px 14px;background:#fff6e7;border:2px solid #d6b98f;border-radius:18px;cursor:pointer;box-shadow:0 4px 9px #64472c16}.cat:hover,.cat.sel{background:#ead7bb;transform:translateY(-3px)}.ico{display:block;font-size:32px;margin-bottom:4px}.cta,.small{border:0;border-radius:999px;padding:13px 30px;background:#8a684c;color:#fff8e9;cursor:pointer;box-shadow:0 6px 13px #63483233}.cta{display:block;margin:25px auto}.cta:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:#826c5a}.nav{position:absolute;right:20px;top:18px;border:1px solid #c6a985;background:#fff4e2;border-radius:999px;padding:7px 13px;cursor:pointer}.positions{max-width:720px;margin:20px auto 15px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;gap:25px}.slot{text-align:center}.slot:nth-child(2){transform:translateY(55px)}.slotbox{height:125px;width:78px;margin:auto;border:3px solid #d8b978;border-radius:8px;background:#30475b;display:grid;place-items:center;color:#e0c47d;font-size:28px}.slotbox.reveal{background:#f5e4c6;color:#715642;font-size:15px}.label{margin-top:8px;font-weight:bold}.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1000px;margin:auto}.reading{background:#fff5e4;border:1px solid #d5b990;border-radius:16px;padding:17px;line-height:1.75}.reading h3{margin:0;font-size:21px}.name{color:#87664c;font-weight:bold}.message{text-align:center;margin:20px auto;max-width:780px;font-size:18px;line-height:1.8;color:#715442}.hidden{display:none}.footer{text-align:center;color:#8b7663;font-size:12px;padding:12px}
@media(max-width:700px){.screen{min-height:650px}.panel{padding:20px 12px}.cats{gap:7px}.cat{min-width:105px;padding:12px 8px}.felt{height:280px}.card{width:48px;height:80px;left:-24px}.positions{gap:7px}.slotbox{width:65px;height:105px}.readings{grid-template-columns:1fr}.top{padding:25px 12px}.sub{font-size:13px}}
</style></head>
<body><div class="wrap"><div class="screen">
<section id="home">
<div class="top"><h1>✦ 療癒塔羅占卜 ✦</h1><div class="sub">在牌的指引中，遇見更好的自己</div></div>
<div class="panel"><div class="note">選擇你想占卜的類別<br>讓塔羅牌為你指引方向</div>
<div class="cats"><button class="cat" data-c="愛情"><span class="ico">♡</span>愛情</button><button class="cat" data-c="工作"><span class="ico">▣</span>工作</button><button class="cat" data-c="學業"><span class="ico">✎</span>學業</button><button class="cat" data-c="健康"><span class="ico">✚</span>健康</button><button class="cat" data-c="人格特質"><span class="ico">☼</span>人格特質</button></div><button class="cta" id="start" disabled>開始選牌</button></div></section>
<section id="draw1" class="hidden"><div class="top"><span class="step">步驟 1</span><h1>請選擇 3 張牌</h1><div class="sub">閉上眼，專注在你的問題，然後從下方的牌堆中依序選出 3 張牌。</div></div><div class="panel"><div class="felt"><div class="stars"><span>✦</span><span>✦</span><span>✧</span></div><div class="deck" id="deck"></div></div><p class="hint" id="hint">第 1 張代表「現在」</p><button class="cta" id="toDraw2" disabled>繼續選牌</button></div></section>
<section id="draw2" class="hidden"><button class="nav" id="back">〈 上一步</button><div class="top"><span class="step">步驟 2</span><h1>請選擇第 2 張牌與第 3 張牌</h1><div class="sub">第 2 張代表「過去」，第 3 張代表「未來」。</div></div><div class="panel"><div class="felt"><div class="stars"><span>✦</span><span>✦</span><span>✧</span></div><div class="deck" id="deck2"></div></div><div class="positions"><div class="slot"><div class="slotbox" id="past">✦</div><div class="label">第 2 張｜過去</div></div><div class="slot"><div class="slotbox" id="present">✦</div><div class="label">第 1 張｜現在</div></div><div class="slot"><div class="slotbox" id="future">✦</div><div class="label">第 3 張｜未來</div></div></div><button class="cta" id="finish" disabled>完成選牌</button></div></section>
<section id="result" class="hidden"><button class="nav" id="homeBtn">⌂ 首頁</button><div class="top"><span class="step">步驟 3</span><h1>占卜結果</h1><div class="sub">這是你選擇的「<b id="catResult"></b>」占卜結果</div></div><div class="panel"><div class="positions"><div class="slot"><div class="slotbox reveal" id="rPast"></div><div class="label">過去</div></div><div class="slot"><div class="slotbox reveal" id="rPresent"></div><div class="label">現在</div></div><div class="slot"><div class="slotbox reveal" id="rFuture"></div><div class="label">未來</div></div></div><div class="readings"><article class="reading"><h3>過去</h3><div class="name" id="pastName"></div><p id="pastText"></p></article><article class="reading"><h3>現在</h3><div class="name" id="presentName"></div><p id="presentText"></p></article><article class="reading"><h3>未來</h3><div class="name" id="futureName"></div><p id="futureText"></p></article></div><div class="message" id="message"></div><div style="text-align:center"><button class="small" id="again">↻ 再占一次</button></div></div></section>
</div><div class="footer">塔羅占卜僅供娛樂與自我反思參考，重要決定請結合實際資訊與專業意見。</div></div>
<script>
const data=[["愚者","旅程、自由、冒險"],["魔術師","創造、行動、資源"],["女祭司","直覺、內在、沉澱"],["皇后","滋養、豐盛、創造"],["皇帝","秩序、責任、穩定"],["教皇","傳承、信念、學習"],["戀人","選擇、連結、價值"],["戰車","意志、前進、突破"],["力量","勇氣、溫柔、韌性"],["隱者","獨處、思考、尋找"],["命運之輪","轉變、循環、機會"],["正義","平衡、真相、選擇"],["吊人","停下、換角度、放下"],["死神","結束、轉化、更新"],["節制","平衡、融合、療癒"],["惡魔","慾望、束縛、依附"],["高塔","突變、真相、重建"],["星星","希望、療癒、願景"],["月亮","感受、未知、想像"],["太陽","喜悅、成功、明朗"],["審判","覺醒、回顧、重生"],["世界","完成、整合、圓滿"]];
const texts={"愛情":["你曾在感情中投入不少，也經歷過調整與學習。","現在更需要誠實面對自己的需求與界線，關係才能更自在。","未來的感情會帶來新的可能，保持真誠並相信自己的感受。"],"工作":["過去的經驗正在累積成你的專業與底氣。","現在適合重新整理目標，勇敢把能力用在真正想做的方向。","未來有新的合作或發展機會，持續行動會比等待更有力量。"],"學業":["過去的學習經驗塑造了現在的能力與方法。","現在適合專注核心目標，找到適合自己的節奏。","未來會逐步看見成果，只要持續累積，不必急著與別人比較。"],"健康":["過去的生活節奏可能讓你忽略休息與內在感受。","現在最重要的是重新找回平衡，照顧睡眠、情緒與日常節奏。","未來適合建立更穩定的生活習慣，慢慢累積身心的力量。"],"人格特質":["過去的經驗讓你形成獨特的處事方式，也留下不少珍貴能力。","現在的你需要更相信自己的直覺與判斷，不必過度迎合外界。","未來會越來越清楚自己的價值，也能把特質轉化成真正的力量。"]};
let cat="",picks=[];const $=id=>document.getElementById(id);function show(id){["home","draw1","draw2","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");cat=b.dataset.c;$("start").disabled=false});
function makeDeck(id){const d=$(id);d.innerHTML="";for(let i=0;i<22;i++){let b=document.createElement("button");b.className="card";let a=-48+i*96/21,x=(i-10.5)*30,y=Math.abs(i-10.5)*1.15;b.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${a}deg)`;b.style.zIndex=i;b.onclick=()=>pick(i,b);d.appendChild(b)}}
function pick(i,b){if(picks.includes(i)||picks.length>=3)return;picks.push(i);b.classList.add("used");if(picks.length===1){$("hint").textContent="第 2 張代表「過去」";$("toDraw2").disabled=false}else if(picks.length===2){$("hint").textContent="第 3 張代表「未來」"}else{$("hint").textContent="三張牌已完成";$('toDraw2').textContent="查看牌陣"}}
$("start").onclick=()=>{picks=[];show("draw1");makeDeck("deck");$("hint").textContent="第 1 張代表「現在」";$("toDraw2").disabled=true};
$("toDraw2").onclick=()=>{if(picks.length<1)return;show("draw2");makeDeck("deck2");$("present").textContent=data[picks[0]][0];$("present").classList.add("reveal");$("finish").disabled=picks.length<3};
$("back").onclick=()=>show("draw1");
$("finish").onclick=()=>{if(picks.length!==3)return;$("past").textContent=data[picks[1]][0];$("future").textContent=data[picks[2]][0];$("past").classList.add("reveal");$("future").classList.add("reveal");$("catResult").textContent=cat;const t=texts[cat];[["rPast",picks[1]],["rPresent",picks[0]],["rFuture",picks[2]]].forEach(([id,i])=>$(id).textContent=data[i][0]);$("pastName").textContent=data[picks[1]][0]+"｜"+data[picks[1]][1];$("presentName").textContent=data[picks[0]][0]+"｜"+data[picks[0]][1];$("futureName").textContent=data[picks[2]][0]+"｜"+data[picks[2]][1];$("pastText").textContent=t[0];$("presentText").textContent=t[1];$("futureText").textContent=t[2];$("message").textContent="塔羅牌不是替你決定未來，而是陪你看見內心的方向。願你在每一次占卜中，都更靠近自己。";show("result")};
$("again").onclick=()=>{picks=[];show("draw1");makeDeck("deck");$("toDraw2").disabled=true;$("toDraw2").textContent="繼續選牌"};$("homeBtn").onclick=()=>show("home");
</script></body></html>
