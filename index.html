<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>療癒塔羅占卜小屋</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Serif TC",serif;color:#4b3829}body{background:#2d221b}.app{width:100%;margin:auto}.page{display:none;position:relative}.page.active{display:block}.paper{background:#fff4dfec;border:2px solid #b89568;border-radius:22px;padding:22px;box-shadow:0 10px 28px #34231955}.title{text-align:center;font-size:clamp(30px,5vw,52px);font-weight:800}.btn{border:2px solid #8d744e;background:#657255;color:#fff9eb;border-radius:999px;padding:14px 30px;font-size:20px;font-weight:700;cursor:pointer;display:block;margin:22px auto;box-shadow:0 6px 0 #454d39}.btn:disabled{opacity:.38;cursor:not-allowed}.lead,.home-note{text-align:center}#home,#draw,#spread,#result{width:100%;aspect-ratio:3/2;min-height:0;overflow:hidden;background-position:center top;background-size:100% 100%;background-repeat:no-repeat}#home{background-image:url('tarot-home-bg.png')}.home-panel{position:absolute;right:3.5%;top:50%;transform:translateY(-50%);width:min(390px,34vw);padding:24px 22px 20px;background:#f7e8cfee;border:2px solid #b99061;border-radius:26px;box-shadow:0 16px 38px #26180e6b}.home-panel h2{text-align:center;margin:0;font-size:28px}.choices{display:grid;gap:10px}.choice{width:100%;padding:12px 18px;background:#f7e7cf;border:2px solid #c29f74;border-radius:999px;font-size:20px;color:#4b3829;cursor:pointer;display:flex;align-items:center;gap:13px}.choice.on{background:#d9d3ae;border-color:#7d805c}.choice span{font-size:27px;width:34px}.check{margin-left:auto;opacity:0}.choice.on .check{opacity:1}.home-panel .btn{width:100%;margin:18px 0 8px}#draw{background-image:url('tarot-home-P1.png');padding:0}#draw .paper{position:absolute;left:31%;right:31%;top:15%;z-index:6;background:transparent;border:0;box-shadow:none;padding:0}#draw .hint{text-align:center;font-size:clamp(14px,1.45vw,22px);font-weight:700;min-height:1.5em}.felt{position:absolute;left:9%;right:9%;top:30%;bottom:8%;z-index:2}.deck{position:absolute;left:50%;bottom:17%;width:0;height:0}.card,.backcard{border:3px solid #d6b778;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455;position:absolute}.card:after,.backcard:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:25px}.card{width:clamp(42px,5vw,76px);height:clamp(70px,8.2vw,124px);left:clamp(-38px,-2.5vw,-21px);bottom:0;transform-origin:50% 100%;cursor:pointer}.used{opacity:.22;pointer-events:none}.chosen{position:absolute;z-index:5;width:clamp(66px,7.1vw,109px);aspect-ratio:2/3;display:none;filter:drop-shadow(0 6px 5px #25180e66)}.chosen.show{display:block}.chosen .backcard{inset:0}.chosen .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-1.7em;white-space:nowrap;color:#fff4df;font-weight:800;font-size:clamp(13px,1.35vw,20px);text-shadow:0 2px 4px #24160f}.chosen.past{left:31%;top:31%;transform:translateX(-50%) rotate(-3deg)}.chosen.future{left:69%;top:31%;transform:translateX(-50%) rotate(3deg)}.chosen.now{left:50%;top:43%;transform:translateX(-50%)}#draw>#next{position:absolute;z-index:7;left:50%;bottom:2.2%;transform:translateX(-50%);margin:0;padding:10px 28px;font-size:clamp(14px,1.5vw,20px)}#spread{background-image:url('tarot-home-P2.png');padding:0}#spread>.paper{position:absolute;inset:0;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0}#spread .title{position:absolute;left:0;right:0;top:20%;z-index:4;font-size:clamp(15px,2.5vw,26px)}.spread{width:54%;height:58%;margin:0;position:absolute;left:23%;top:24%;z-index:3}.slot{position:absolute;width:clamp(62px,7vw,108px);aspect-ratio:2/3;border:3px solid #d8b878;border-radius:8px;background:#20364b center/cover no-repeat;box-shadow:0 6px 14px #24160f66}.slot .backcard{display:none}.slot.past{left:18%;top:15%}.slot.future{right:18%;top:15%}.slot.now{left:50%;top:59%;transform:translateX(-50%)}.lab{position:absolute;background:#fff1d9;border:1px solid #c7a778;border-radius:999px;padding:6px 10px}.lab.past{left:17%;top:45%}.lab.future{right:17%;top:45%}.lab.now{left:50%;top:88%;transform:translateX(-50%)}#spread #finish{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);margin:0;z-index:5}#result{background-image:url('tarot-home-P3.png');padding:0}#result>.paper{position:absolute;inset:0;background:transparent;border:0;border-radius:0;box-shadow:none;padding:24px}#result #outcat{width:max-content;max-width:70%;margin:8px auto 16px;padding:9px 24px;background:#f7e8cfee;border:1px solid #b89568;border-radius:999px;box-shadow:0 4px 12px #34231933;text-align:center;font-weight:800;font-size:clamp(15px,1.8vw,25px);line-height:1.35;color:#4b3829}#night{min-height:100vh;padding:24px;background:linear-gradient(#f8ecd7,#ead5b7)}.resultcards{display:flex;justify-content:center;gap:55px;margin:25px}.mini{width:110px;aspect-ratio:2/3;border:3px solid #d8b878;border-radius:8px;background:#20364b center/cover no-repeat}.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.read{background:#fff7e8;border:1px solid #c9a97f;border-radius:16px;padding:14px;line-height:1.7}#night{background:linear-gradient(#26334a,#596270 70%,#8b7258)}#night .paper{background:#29364acc;color:#fff8e8;text-align:center;margin-top:18vh}.side{position:absolute;right:16px;top:45%;display:grid;gap:10px}@media(max-width:850px){html,body{background:#2d221b}.app{width:100%;overflow-x:hidden}#home,#draw,#spread,#result{aspect-ratio:auto;min-height:100svh;background-size:cover;background-position:center top}#home{background-image:url('tarot-home-bg-sp.png');background-position:center top}.home-panel{top:auto;bottom:3.5%;left:5%;right:5%;transform:none;width:auto;padding:16px 14px 14px;border-radius:22px;background:#f7e8cff2}.home-panel h2{font-size:19px;margin-bottom:3px}.home-panel .lead{font-size:12px;margin-bottom:8px}.choices{grid-template-columns:1fr 1fr;gap:8px}.choice{font-size:15px;padding:9px 11px;min-height:44px}.choice span{font-size:21px;width:25px}.choice:last-child{grid-column:1/-1}.home-panel .btn{font-size:16px;padding:11px;margin:10px 0 4px;min-height:46px}.home-note{font-size:11px}#draw{background-position:center top}#draw .paper{left:7%;right:7%;top:calc(13% + 1em);padding:0}#draw .hint{font-size:17px;line-height:1.5;color:#4b3829;text-shadow:0 1px 0 #fff8e8}.felt{left:2%;right:2%;top:26%;bottom:11%}.deck{bottom:13%}.card{width:52px;height:84px;left:-26px}.card:after,.backcard:after{inset:6px;font-size:18px}.chosen{width:70px}.chosen.past{left:24%;top:calc(43% - 52.5px)}.chosen.future{left:76%;top:calc(43% - 52.5px)}.chosen.now{left:50%;top:43%}.chosen .tag{font-size:13px;bottom:-1.55em}#draw>#next{bottom:2.8%;font-size:16px;padding:10px 24px;min-width:150px}#spread{background-position:center top}#spread .title{top:16%;font-size:20px;text-shadow:0 1px 0 #fff8e8}.spread{width:92%;height:64%;left:4%;top:19%}.slot{width:86px}.slot.past{left:11%;top:calc(53% - 64.5px)}.slot.future{right:11%;top:calc(53% - 64.5px)}.slot.now{left:50%;top:53%}.lab{font-size:12px;padding:5px 9px}.lab.past{left:12%;top:43%}.lab.future{right:12%;top:43%}.lab.now{left:50%;top:84%}#spread #finish{bottom:3.2%;font-size:16px;padding:10px 26px;min-width:150px}#result{min-height:100svh;height:auto;overflow:visible;background-position:center top;background-size:cover}#result>.paper{position:relative;inset:auto;min-height:100svh;padding:22px 14px 34px}#result .title{font-size:28px;margin-top:2px;text-shadow:0 1px 0 #fff8e8}#result #outcat{max-width:92%;padding:7px 14px;margin:8px auto 14px;font-size:16px;white-space:normal}.resultcards{gap:8px;margin:12px auto 16px;align-items:flex-start}.resultcards>div{width:31%;text-align:center;font-size:13px}.mini{width:min(25vw,92px);margin:auto;border-width:2px}.reads{grid-template-columns:1fr;gap:10px;margin-top:8px}.read{padding:12px 14px;font-size:14px;line-height:1.65;background:#fff7e8ef}.read b{font-size:16px}.read p{margin:6px 0 0}#result #close{font-size:16px;padding:11px 30px;margin:18px auto 0}#night{min-height:100svh;padding:16px}#night .paper{margin-top:14vh;padding:20px 16px}#night .paper h1{font-size:25px;line-height:1.35}.side{position:static;margin:22px auto 0;display:flex;flex-direction:column;gap:10px;max-width:260px}.side button{font-size:16px;padding:11px;border-radius:999px}}@media(max-width:430px){#home{background-position:center top}.home-panel{left:4%;right:4%;bottom:2.5%}.choice{font-size:14px}.felt{top:28%}.chosen.past{left:22%}.chosen.future{left:78%}.slot.past{left:8%}.slot.future{right:8%}.mini{width:24vw}}</style></head><body><main class="app"><section id="home" class="page active"><div class="home-panel"><h2>請選擇你想占卜的主題</h2><div class="lead">— 讓塔羅為你指引方向 —</div><div class="choices"><button class="choice" data-cat="愛情"><span>♡</span>愛情<b class="check">✓</b></button><button class="choice" data-cat="工作"><span>💼</span>工作<b class="check">✓</b></button><button class="choice" data-cat="學業"><span>📖</span>學業<b class="check">✓</b></button><button class="choice" data-cat="健康"><span>🌱</span>健康<b class="check">✓</b></button><button class="choice" data-cat="人格特質"><span>★</span>人格特質<b class="check">✓</b></button></div><button id="start" class="btn" disabled>前往占卜 →</button><div class="home-note">選擇一個主題，開啟屬於你的指引吧 ♡</div></div></section><section id="draw" class="page"><div class="paper"><div id="hint" class="hint">第 1 張代表「現在」</div></div><div id="pastCard" class="chosen past"><div class="backcard"></div><div class="tag">過去</div></div><div id="futureCard" class="chosen future"><div class="backcard"></div><div class="tag">未來</div></div><div id="nowCard" class="chosen now"><div class="backcard"></div><div class="tag">現在</div></div><div class="felt"><div id="deck" class="deck"></div></div><button id="next" class="btn" disabled>選牌完成</button></section><section id="spread" class="page"><div class="paper"><div class="title">聖三角占卜法</div><div class="spread"><div class="slot past"><div class="backcard"></div></div><div class="slot future"><div class="backcard"></div></div><div class="slot now"><div class="backcard"></div></div><div class="lab past">過去</div><div class="lab future">未來</div><div class="lab now">現在</div></div><button id="finish" class="btn">牌面解析</button></div></section><section id="result" class="page"><div class="paper"><div class="title">占卜結果 ✦</div><div id="outcat"></div><div class="resultcards"><div><div class="mini"></div><div id="n0"></div></div><div><div class="mini"></div><div id="n1"></div></div><div><div class="mini"></div><div id="n2"></div></div></div><div class="reads"><article class="read"><b>過去</b><p id="t0"></p></article><article class="read"><b>現在</b><p id="t1"></p></article><article class="read"><b>未來</b><p id="t2"></p></article></div><button id="close" class="btn">結束</button></div></section><section id="night" class="page"><div class="paper"><h1>願這次的占卜，成為溫柔的提醒</h1><p>塔羅牌不是預言，而是陪你看見內心的方向。<br>願你在每一次的選擇裡，都更靠近自己想要的生活。</p></div><div class="side"><button id="again">↻ 再占一次</button><button id="tohome">⌂ 回到首頁</button><button id="share">⌯ 分享結果</button></div></section></main><script>const cards=['愚者','魔術師','女祭司','皇后','皇帝','教皇','戀人','戰車','力量','隱者','命運之輪','正義','倒吊人','死神','節制','惡魔','高塔','星星','月亮','太陽','審判','世界'];const meanings=['自由、不希望被限制、冒險與新的開始','主動積極、充滿能量、具創造力並善用能量','相信直覺、耐心傾聽內在、沉澱心情、等待時機浮現','豐收的時機、享受成果','意志清晰堅定、掌握方向、展現領導力','信念、學習與傳統智慧','選擇、連結與真誠關係','行動、意志與向前突破','勇氣、耐心與溫柔力量','獨處、探索與內在答案','轉機、循環與命運流動','平衡、公平與理性決定','停頓、換位思考與放下','結束、蛻變與重新開始','調和、節奏與身心平衡','執著、慾望與需要看見的束縛','突變、覺醒與舊結構瓦解','希望、療癒與重新相信','不安、想像與尚未明朗的感受','喜悅、自信與清楚展現','覺醒、回顧與重要召喚','完成、整合與走向新階段'];const topic={愛情:['讓感情保有空間與新的可能','主動表達心意，也看見自己在關係中的影響力','傾聽直覺，別急著替關係下結論','用溫柔與照顧滋養彼此的連結','建立清楚界線與可靠的安全感','重新思考你對承諾與關係的信念','一段重要關係或選擇正在被照亮','勇敢推動關係前進，但別忽略彼此步調','以耐心和包容面對感情中的拉扯','需要一些空間確認自己真正想要的愛','感情可能迎來轉折，順勢看見新的可能','在愛裡追求公平，也誠實面對彼此責任','暫時放慢，換個角度理解這段關係','某種舊模式需要結束，才能迎接新的感情狀態','關係需要協調、磨合與剛好的距離','留意依賴、控制或難以放下的執著','關係中的真相可能突然浮現，促使你重新選擇','愛情正在走向療癒，重新相信愛的可能','別讓猜測代替溝通，先釐清真正的感受','感情有更坦率、溫暖與明朗的發展空間','過去的感情經驗正在喚醒你更成熟的選擇','一段關係有機會走向完整，也可能進入新的階段'],工作:['勇於嘗試新方向，別讓未知阻止你起步','你有能力主動創造機會，把想法化為行動','先觀察局勢並相信專業直覺','讓創意與資源慢慢長成可見成果','建立制度、界線與穩定的執行方式','從前輩、制度或專業知識中找到支點','工作上正面臨與價值觀有關的重要選擇','集中力量推進目標，行動會帶來突破','用穩定與韌性處理壓力，比硬碰硬更有效','適合沉澱、研究並確認真正想走的職涯方向','工作局勢可能出現轉機，保持彈性','以客觀標準衡量選擇，合約與責任要清楚','暫時停一下，換個角度可能找到解法','舊的工作方式或階段需要結束，為新方向騰出位置','調整工作節奏與資源配置，找到可長久的平衡','留意過度工作、權力或對成就的執著','原有計畫可能被打破，但也會迫使你看見真正問題','新的職涯方向與希望逐漸清晰，持續累積會被看見','資訊尚未完全明朗，重要決定前先查證','成果與能見度提升，適合自信展現能力','一次重要評估或召喚，可能讓你重新定位工作方向','努力逐漸整合成成果，準備迎接下一個職涯階段'],學業:['保持好奇，新的學習旅程值得開始','善用現有能力與工具，你有把知識化為成果的潛力','安靜理解比死背更重要，相信自己的學習直覺','讓知識慢慢累積，穩定投入會帶來成長','建立讀書規律與清楚目標','適合跟隨老師、課程或成熟的方法建立基礎','需要在科目、方向或目標間做真誠選擇','集中注意力向目標推進，克服分心','耐心面對難題，你比自己想像得更有韌性','獨立思考與深度研究會帶來答案','學習狀態可能出現轉機，善用新的機會','客觀看待成績與投入，調整不平衡之處','遇到瓶頸時先停一下，換方法比勉強更有效','舊的學習習慣需要更新，才能突破目前階段','安排休息與讀書節奏，穩定比衝刺更重要','留意對分數、比較或完美的過度執著','原本的方法可能失效，正好重新建立更適合的基礎','對學習重新找回希望，長期目標會逐漸清楚','迷惘並不代表失敗，先把資訊與情緒分開','理解力與成果有提升機會，適合積極展現','回顧過去學習經驗，你正在看見真正適合自己的方向','一個學習階段接近完成，成果將帶你走向下一站'],健康:['用輕盈方式重新開始照顧自己，建立可持續的小習慣','主動調整日常，你擁有改善生活節奏的資源','傾聽身體訊號，休息與觀察同樣重要','滋養、睡眠與溫柔照顧是目前重點','建立規律作息與穩定生活框架','適合遵循可靠的健康常識與專業建議','在生活習慣中做更符合身心需要的選擇','循序增加行動力，讓身體重新找到節奏','溫和而持續地培養體力，不必逼迫自己','需要安靜休息，重新聽見身體真正需求','身心狀態有週期起伏，保持彈性並觀察變化','讓工作、休息與活動重新取得平衡','若感到停滯，先允許自己休息並換個角度照顧身體','需要告別不合適的舊習慣，為新的生活方式留空間','節制與規律最重要，避免忽冷忽熱的生活節奏','留意過度依賴、熬夜或難以停止的習慣','身體的提醒不宜忽略，必要時尋求合格醫療專業協助','現在適合恢復、休息與重新建立對身體的信任','焦慮可能放大感受，不確定的症狀應交由醫療專業判斷','活力逐漸回升，戶外活動與規律生活能帶來支持','重新檢視生活方式，回應身體真正需要的改變','一段調整期逐漸完成，新的健康節奏正在形成'],人格特質:['你有自由、好奇且願意探索未知的一面','你善於把想法化成行動，也懂得運用手邊資源','你敏銳、內省，常能察覺別人沒說出口的訊息','你具有滋養他人、創造美感與讓事物成長的力量','你重視秩序、責任與掌控感，適合建立穩定結構','你看重信念與原則，也有傳遞知識的能力','你重視關係與價值一致，人生常透過選擇認識自己','你意志明確，一旦決定方向就有強大的推進力','你的力量來自耐心、包容與不輕易放棄','你需要獨處整理內心，也擅長深度思考','你具有順應變化的能力，人生轉折常帶你成長','你重視公平與邏輯，做決定時希望忠於原則','你能從不同角度看事情，也正在學習放下控制','你具有強大的蛻變力，能在結束後重新長出新的自己','你擅長協調差異，追求穩定而不極端的生活方式','你有強烈慾望與吸引力，也需要看見自己的執著與界線','你不怕真相，人生的突變常促使你快速覺醒','你帶有希望感與療癒他人的氣質，也願意相信更好的可能','你想像力豐富且感受敏銳，但有時容易被不安影響','你溫暖、坦率而有生命力，適合自在展現自己','你具有反思與自我更新能力，常在關鍵時刻聽見內在召喚','你擅長整合經驗，成熟後會展現完整而穩定的力量']};const pos={過去:'回看過去，這張牌顯示：',現在:'此刻這張牌提醒你：',未來:'往前看，這張牌帶來的方向是：'};function interpret(card,category,position){return pos[position]+meanings[card]+'。'+topic[category][card]+'。'}let cat='',p=[];const $=x=>document.getElementById(x),img=i=>`tarot-card_${String(i).padStart(2,'0')}.png`;function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active');scrollTo(0,0)}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;$('start').disabled=false});function resetChosen(){['pastCard','nowCard','futureCard'].forEach(x=>$(x).classList.remove('show'))}function deck(){let d=$('deck');d.innerHTML='';let gap=innerWidth<=850?14:30;for(let i=0;i<22;i++){let b=document.createElement('button');b.className='card';let a=-48+i*96/21,x=(i-10.5)*gap,y=Math.abs(i-10.5)*(innerWidth<=850?.7:1.2);b.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${a}deg)`;b.style.zIndex=i;b.onclick=()=>pick(i,b);d.appendChild(b)}}function pick(i,b){if(p.includes(i)||p.length===3)return;p.push(i);b.classList.add('used');let target=p.length===1?'nowCard':p.length===2?'pastCard':'futureCard';$(target).classList.add('show');$('hint').textContent=p.length===1?'第 2 張代表「過去」':p.length===2?'第 3 張代表「未來」':'';$('next').disabled=p.length!==3}$('start').onclick=()=>{p=[];resetChosen();deck();$('hint').textContent='第 1 張代表「現在」';$('next').disabled=true;show('draw')};$('next').onclick=()=>{let order=[p[1],p[0],p[2]];document.querySelectorAll('#spread .slot').forEach((s,i)=>s.style.backgroundImage=`url('${img(order[i])}')`);show('spread')};$('finish').onclick=()=>{let order=[p[1],p[0],p[2]],positions=['過去','現在','未來'];document.querySelectorAll('.mini').forEach((m,i)=>m.style.backgroundImage=`url('${img(order[i])}')`);order.forEach((v,i)=>{$('n'+i).textContent=cards[v];$('t'+i).textContent=interpret(v,cat,positions[i])});$('outcat').textContent='「'+cat+'」的聖三角指引';show('result')};$('close').onclick=()=>show('night');$('again').onclick=()=>show('home');$('tohome').onclick=()=>show('home');$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('已複製遊戲網址！')}catch(e){alert('請複製瀏覽器網址分享喔！')}};</script></body></html>
