<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>療癒塔羅占卜小屋</title><style>*{box-sizing:border-box}body{margin:0;background:#d9c5a5;color:#574131;font-family:"Microsoft JhengHei",sans-serif}.app{max-width:980px;margin:auto;min-height:100vh;background:#f4e5ce;overflow:hidden}.page{display:none;min-height:100vh;position:relative;padding:24px;background:radial-gradient(circle at 8% 15%,#71835a 0 2%,transparent 2.5%),radial-gradient(circle at 95% 85%,#70825b 0 3%,transparent 3.5%),linear-gradient(#f9efde,#edd9bc)}.page.active{display:block}.paper{background:#fff1d9eF;border:2px solid #c7a778;border-radius:22px;padding:22px;box-shadow:0 8px 20px #6d513522}.title{text-align:center;font-size:clamp(30px,6vw,56px);font-weight:800;letter-spacing:.12em}.sub{text-align:center;margin:8px 0 20px}.scene{position:absolute;opacity:.16;font-size:100px}.girl{left:7%;bottom:17%;font-size:110px}.cat{right:8%;bottom:15%;font-size:80px}.leaf{right:3%;top:4%;font-size:70px}.cats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}.choice{width:130px;padding:18px 8px;background:#fff7e9;border:2px solid #c8aa80;border-radius:18px;font-size:18px;cursor:pointer}.choice:hover,.choice.on{background:#ead6b9;transform:translateY(-3px)}.choice span{display:block;font-size:34px}.btn{border:2px solid #b48c61;background:#8b684a;color:#fff9eb;border-radius:999px;padding:12px 28px;font-size:18px;font-weight:bold;cursor:pointer;display:block;margin:22px auto}.btn:disabled{opacity:.4}.felt{max-width:860px;height:380px;margin:22px auto;background:radial-gradient(circle,#d8bd7b 1px,transparent 2px) 0 0/24px 24px,#3f6257;border:12px solid #b99a6b;border-radius:50%;position:relative;box-shadow:inset 0 0 0 2px #e4cb92}.deck{position:absolute;left:50%;bottom:25px;width:0;height:0}.card{position:absolute;width:66px;height:110px;left:-33px;bottom:0;border:3px solid #d8b878;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455;transform-origin:50% 100%;cursor:pointer}.card:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:25px}.used{opacity:.25;pointer-events:none}.hint{text-align:center;font-size:18px}.spread{max-width:680px;height:350px;margin:15px auto;position:relative}.slot{position:absolute;width:92px;height:145px;border:3px solid #d8b878;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455}.slot:after{content:"✦";position:absolute;inset:9px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:28px}.slot.past{left:12%;top:5%}.slot.future{right:12%;top:5%}.slot.now{left:calc(50% - 46px);top:47%}.lab{position:absolute;background:#fff1d9;border:1px solid #c7a778;border-radius:999px;padding:6px 10px}.lab.past{left:8%;top:48%}.lab.future{right:8%;top:48%}.lab.now{left:42%;top:92%}.resultcards{display:flex;justify-content:center;gap:55px;margin:25px}.mini{width:90px;height:135px;border:3px solid #d8b878;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);position:relative}.mini:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;color:#e6ca82;display:grid;place-items:center}.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.read{background:#fff7e8;border:1px solid #c9a97f;border-radius:16px;padding:14px;line-height:1.7}.night{background:radial-gradient(circle at 75% 15%,#f0d48b 0 1%,transparent 8%),linear-gradient(#26334a,#596270 70%,#8b7258)}.night .paper{background:#29364acc;color:#fff8e8;border-color:#c9aa72;text-align:center;margin-top:18vh}.side{position:absolute;right:16px;top:45%;display:grid;gap:10px}.side button{background:#fff1dc;border:2px solid #c3a172;border-radius:14px;padding:10px;color:#654b37;font-weight:bold;cursor:pointer}@media(max-width:650px){.page{padding:12px}.felt{height:300px}.card{width:48px;height:82px;left:-24px}.choice{width:31%;font-size:14px}.reads{grid-template-columns:1fr}.resultcards{gap:20px}.mini{width:64px;height:96px}.spread{height:300px}.slot{width:68px;height:108px}.slot.now{left:calc(50% - 34px)}.side{top:35%;right:8px}}</style></head><body><main class="app"><section id="home" class="page active"><div class="scene girl">👧</div><div class="scene cat">🐈</div><div class="scene leaf">🌿</div><div class="paper"><div class="title">✦ 療癒塔羅占卜 ✦</div><div class="sub">在牌的指引中，遇見更好的自己</div><div class="sub">選擇你想占卜的類別，讓塔羅牌為你指引方向 ♡</div><div class="cats"><button class="choice" data-cat="愛情"><span>♡</span>愛情</button><button class="choice" data-cat="工作"><span>💼</span>工作</button><button class="choice" data-cat="學業"><span>🎓</span>學業</button><button class="choice" data-cat="健康"><span>✚</span>健康</button><button class="choice" data-cat="人格特質"><span>☼</span>人格特質</button></div><button id="start" class="btn" disabled>開始選牌</button></div></section><section id="draw" class="page"><div class="paper"><div class="title" style="font-size:32px">步驟 1　請選擇 3 張牌 ✦</div><div id="hint" class="hint">第 1 張代表「現在」</div></div><div class="felt"><div id="deck" class="deck"></div></div><button id="next" class="btn" disabled>繼續選牌</button></section><section id="spread" class="page"><div class="paper"><div class="title" style="font-size:30px">步驟 2　聖三角牌陣</div><div class="sub">第 2 張代表「過去」｜第 1 張代表「現在」｜第 3 張代表「未來」</div><div class="spread"><div class="slot past"></div><div class="slot future"></div><div class="slot now"></div><div class="lab past">過去</div><div class="lab future">未來</div><div class="lab now">現在</div></div><button id="finish" class="btn">完成選牌</button></div></section><section id="result" class="page"><div class="paper"><div class="title" style="font-size:32px">步驟 3　占卜結果 ✦</div><div id="outcat" class="sub"></div><div class="resultcards"><div><div class="mini"></div><div id="n0" class="sub"></div></div><div><div class="mini"></div><div id="n1" class="sub"></div></div><div><div class="mini"></div><div id="n2" class="sub"></div></div></div><div class="reads"><article class="read"><b>過去</b><p id="t0"></p></article><article class="read"><b>現在</b><p id="t1"></p></article><article class="read"><b>未來</b><p id="t2"></p></article></div><button id="close" class="btn">查看療癒訊息</button></div></section><section id="night" class="page night"><div class="paper"><h1>願這次的占卜，成為溫柔的提醒</h1><p>塔羅牌不是預言，而是陪你看見內心的方向。<br>願你在每一次的選擇裡，都更靠近自己想要的生活。</p><p>♡ 相信自己，你正在慢慢走向更好的生活 ♡</p></div><div class="side"><button id="again">↻ 再占一次</button><button id="tohome">⌂ 回到首頁</button><button id="share">⌯ 分享結果</button></div></section></main><script>const cards=[["愚者","旅程、自由、冒險"],["魔術師","創造、行動、資源"],["女祭司","直覺、內在、沉澱"],["皇后","滋養、豐盛、創造"],["皇帝","秩序、責任、穩定"],["教皇","傳承、信念、學習"],["戀人","選擇、連結、價值"],["戰車","意志、前進、突破"],["力量","勇氣、溫柔、韌性"],["隱者","獨處、思考、尋找"],["命運之輪","轉變、循環、機會"],["正義","平衡、真相、選擇"],["吊人","停下、換角度、放下"],["死神","結束、轉化、更新"],["節制","平衡、融合、療癒"],["惡魔","慾望、束縛、依附"],["高塔","突變、真相、重建"],["星星","希望、療癒、願景"],["月亮","感受、未知、想像"],["太陽","喜悅、成功、明朗"],["審判","覺醒、回顧、重生"],["世界","完成、整合、圓滿"]];const tx={愛情:["過去的感情經驗讓你更了解自己的需求與界線。","現在適合誠實面對內心，讓關係回到真誠與自在。","未來有新的可能靠近，保持開放並相信自己的感受。"],工作:["過去累積的經驗正在成為你的專業與底氣。","現在適合整理目標，把能力用在真正想投入的方向。","未來有新的合作或發展機會，持續行動會帶來改變。"],學業:["過去的學習經驗已經替你打下重要基礎。","現在適合專注核心目標，找到自己的學習節奏。","未來會逐步看見成果，持續累積就是你的力量。"],健康:["過去的生活節奏可能讓你忽略休息與內在感受。","現在最重要的是重新找回平衡，照顧睡眠與日常節奏。","未來適合建立穩定習慣，慢慢累積身心力量。"],人格特質:["過去的經驗形成了你獨特的處事方式與能力。","現在需要更相信自己的直覺與判斷。","未來會越來越清楚自己的價值，並把特質化為力量。"]};let cat='',p=[];const $=x=>document.getElementById(x);function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active')}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;$('start').disabled=false});function deck(){let d=$('deck');d.innerHTML='';for(let i=0;i<22;i++){let b=document.createElement('button');b.className='card';let a=-48+i*96/21,x=(i-10.5)*30,y=Math.abs(i-10.5)*1.2;b.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${a}deg)`;b.style.zIndex=i;b.onclick=()=>pick(i,b);d.appendChild(b)}}function pick(i,b){if(p.includes(i)||p.length===3)return;p.push(i);b.classList.add('used');$('hint').textContent=p.length===1?'第 2 張代表「過去」':p.length===2?'第 3 張代表「未來」':'三張牌已選好，準備進入聖三角牌陣 ✦';$('next').disabled=p.length!==3}$('start').onclick=()=>{p=[];deck();$('next').disabled=true;show('draw')};$('next').onclick=()=>show('spread');$('finish').onclick=()=>{for(let i=0;i<3;i++){$('n'+i).textContent=cards[p[i]][0]+'・'+cards[p[i]][1];$('t'+i).textContent=tx[cat][i]}$('outcat').textContent='「'+cat+'」的聖三角指引';show('result')};$('close').onclick=()=>show('night');$('again').onclick=()=>{$('start').disabled=false;show('home')};$('tohome').onclick=()=>show('home');$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('已複製遊戲網址，快分享給朋友吧！')}catch(e){alert('請直接複製瀏覽器網址分享給朋友喔！')}};</script></body></html>
