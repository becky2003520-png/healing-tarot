<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>療癒塔羅占卜小屋</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Serif TC",serif;color:#4b3829}body{background:#2d221b}.app{min-height:100vh}.page{display:none;min-height:100vh;position:relative}.page.active{display:block}.paper{background:#fff4dfec;border:2px solid #b89568;border-radius:22px;padding:22px;box-shadow:0 10px 28px #34231955}.title{text-align:center;font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:.08em}.sub{text-align:center;margin:8px 0 20px}.btn{border:2px solid #8d744e;background:#657255;color:#fff9eb;border-radius:999px;padding:14px 30px;font-size:20px;font-weight:700;cursor:pointer;display:block;margin:22px auto;letter-spacing:.08em;box-shadow:0 6px 0 #454d39}.btn:disabled{opacity:.38;cursor:not-allowed}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 4px 0 #454d39}
/* HOME */#home{background:url('tarot-home-bg.png') center center/cover no-repeat;overflow:hidden}.home-overlay{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 58%,rgba(25,18,13,.08) 100%);pointer-events:none}.home-panel{position:absolute;right:3.5%;top:50%;transform:translateY(-50%);width:min(390px,34vw);padding:24px 22px 20px;background:rgba(247,232,207,.94);border:2px solid #b99061;border-radius:26px;box-shadow:0 16px 38px rgba(38,24,14,.42);backdrop-filter:blur(2px)}.home-panel h2{margin:0;text-align:center;font-size:28px;letter-spacing:.08em}.home-panel .lead{text-align:center;margin:7px 0 16px;color:#765b43}.choices{display:grid;gap:10px}.choice{width:100%;padding:12px 18px;background:#f7e7cf;border:2px solid #c29f74;border-radius:999px;font-size:20px;color:#4b3829;cursor:pointer;display:flex;align-items:center;gap:13px;transition:.18s}.choice:hover{transform:translateY(-2px);background:#f0dbc0}.choice.on{background:#d9d3ae;border-color:#7d805c;box-shadow:inset 0 0 0 2px #a5a477}.choice span{font-size:27px;width:34px;text-align:center}.choice .check{margin-left:auto;opacity:0;color:#5f6d4a}.choice.on .check{opacity:1}.home-panel .btn{width:100%;margin:18px 0 8px;font-size:23px}.home-note{text-align:center;font-size:13px;color:#765c44}
/* GAME */#draw,#spread,#result{padding:24px;background:linear-gradient(#f8ecd7,#ead5b7)}.felt{max-width:880px;height:390px;margin:25px auto;background:radial-gradient(circle,#d5b56e 1px,transparent 2px) 0 0/28px 28px,#35594e;border:12px solid #ae8c60;border-radius:50%;position:relative;box-shadow:inset 0 0 0 2px #e1c68c}.deck{position:absolute;left:50%;bottom:28px;width:0;height:0}.card{position:absolute;width:66px;height:110px;left:-33px;bottom:0;border:3px solid #d6b778;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455;transform-origin:50% 100%;cursor:pointer}.card:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:25px}.used{opacity:.25;pointer-events:none}.hint{text-align:center;font-size:18px}.spread{max-width:680px;height:350px;margin:15px auto;position:relative}.slot{position:absolute;width:92px;height:145px;border:3px solid #d8b878;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);box-shadow:0 5px 12px #29201455}.slot:after{content:"✦";position:absolute;inset:9px;border:1px solid #d8b878;border-radius:5px;color:#e6ca82;display:grid;place-items:center;font-size:28px}.slot.past{left:12%;top:5%}.slot.future{right:12%;top:5%}.slot.now{left:calc(50% - 46px);top:47%}.lab{position:absolute;background:#fff1d9;border:1px solid #c7a778;border-radius:999px;padding:6px 10px}.lab.past{left:8%;top:48%}.lab.future{right:8%;top:48%}.lab.now{left:42%;top:92%}.resultcards{display:flex;justify-content:center;gap:55px;margin:25px}.mini{width:90px;height:135px;border:3px solid #d8b878;border-radius:8px;background:linear-gradient(135deg,#20364b,#43586b);position:relative}.mini:after{content:"✦";position:absolute;inset:8px;border:1px solid #d8b878;color:#e6ca82;display:grid;place-items:center}.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.read{background:#fff7e8;border:1px solid #c9a97f;border-radius:16px;padding:14px;line-height:1.7}
#night{padding:24px;background:radial-gradient(circle at 75% 15%,#f0d48b 0 1%,transparent 8%),linear-gradient(#26334a,#596270 70%,#8b7258)}#night .paper{background:#29364acc;color:#fff8e8;border-color:#c9aa72;text-align:center;margin-top:18vh}.side{position:absolute;right:16px;top:45%;display:grid;gap:10px}.side button{background:#fff1dc;border:2px solid #c3a172;border-radius:14px;padding:10px;color:#654b37;font-weight:bold;cursor:pointer}
@media(max-width:850px){#home{min-height:1100px;background-position:38% center}.home-panel{top:auto;bottom:24px;left:6%;right:6%;transform:none;width:auto;padding:20px}.choices{grid-template-columns:1fr 1fr}.home-panel h2{font-size:24px}}@media(max-width:600px){#home{min-height:1050px;background-position:36% center}.home-panel{left:4%;right:4%;bottom:18px}.choices{grid-template-columns:1fr}.choice{font-size:17px;padding:9px 14px}.home-panel .btn{font-size:20px;padding:12px}.felt{height:300px}.card{width:48px;height:82px;left:-24px}.reads{grid-template-columns:1fr}.resultcards{gap:20px}.mini{width:64px;height:96px}.spread{height:300px}.slot{width:68px;height:108px}.slot.now{left:calc(50% - 34px)}.side{top:35%;right:8px}}</style></head><body><main class="app"><section id="home" class="page active"><div class="home-overlay"></div><div class="home-panel"><h2>請選擇你想占卜的主題</h2><div class="lead">— 讓塔羅為你指引方向 —</div><div class="choices"><button class="choice" data-cat="愛情"><span>♡</span>愛情<b class="check">✓</b></button><button class="choice" data-cat="工作"><span>💼</span>工作<b class="check">✓</b></button><button class="choice" data-cat="學業"><span>📖</span>學業<b class="check">✓</b></button><button class="choice" data-cat="健康"><span>🌱</span>健康<b class="check">✓</b></button><button class="choice" data-cat="人格特質"><span>★</span>人格特質<b class="check">✓</b></button></div><button id="start" class="btn" disabled>前往占卜　→</button><div class="home-note">選擇一個主題，開啟屬於你的指引吧 ♡</div></div></section><section id="draw" class="page"><div class="paper"><div class="title" style="font-size:32px">步驟 1　請選擇 3 張牌 ✦</div><div id="hint" class="hint">第 1 張代表「現在」</div></div><div class="felt"><div id="deck" class="deck"></div></div><button id="next" class="btn" disabled>選牌完成</button></section><section id="spread" class="page"><div class="paper"><div class="title" style="font-size:30px">步驟 2　聖三角牌陣</div><div class="sub">第 2 張代表「過去」｜第 1 張代表「現在」｜第 3 張代表「未來」</div><div class="spread"><div class="slot past"></div><div class="slot future"></div><div class="slot now"></div><div class="lab past">過去</div><div class="lab future">未來</div><div class="lab now">現在</div></div><button id="finish" class="btn">結果解析</button></div></section><section id="result" class="page"><div class="paper"><div class="title" style="font-size:32px">步驟 3　占卜結果 ✦</div><div id="outcat" class="sub"></div><div class="resultcards"><div><div class="mini"></div><div id="n0" class="sub"></div></div><div><div class="mini"></div><div id="n1" class="sub"></div></div><div><div class="mini"></div><div id="n2" class="sub"></div></div></div><div class="reads"><article class="read"><b>過去</b><p id="t0"></p></article><article class="read"><b>現在</b><p id="t1"></p></article><article class="read"><b>未來</b><p id="t2"></p></article></div><button id="close" class="btn">查看療癒訊息</button></div></section><section id="night" class="page"><div class="paper"><h1>願這次的占卜，成為溫柔的提醒</h1><p>塔羅牌不是預言，而是陪你看見內心的方向。<br>願你在每一次的選擇裡，都更靠近自己想要的生活。</p><p>♡ 相信自己，你正在慢慢走向更好的生活 ♡</p></div><div class="side"><button id="again">↻ 再占一次</button><button id="tohome">⌂ 回到首頁</button><button id="share">⌯ 分享結果</button></div></section></main><script>const cards=[["愚者","旅程、自由、冒險"],["魔術師","創造、行動、資源"],["女祭司","直覺、內在、沉澱"],["皇后","滋養、豐盛、創造"],["皇帝","秩序、責任、穩定"],["教皇","傳承、信念、學習"],["戀人","選擇、連結、價值"],["戰車","意志、前進、突破"],["力量","勇氣、溫柔、韌性"],["隱者","獨處、思考、尋找"],["命運之輪","轉變、循環、機會"],["正義","平衡、真相、選擇"],["吊人","停下、換角度、放下"],["死神","結束、轉化、更新"],["節制","平衡、融合、療癒"],["惡魔","慾望、束縛、依附"],["高塔","突變、真相、重建"],["星星","希望、療癒、願景"],["月亮","感受、未知、想像"],["太陽","喜悅、成功、明朗"],["審判","覺醒、回顧、重生"],["世界","完成、整合、圓滿"]];const tx={愛情:["過去的感情經驗讓你更了解自己的需求與界線。","現在適合誠實面對內心，讓關係回到真誠與自在。","未來有新的可能靠近，保持開放並相信自己的感受。"],工作:["過去累積的經驗正在成為你的專業與底氣。","現在適合整理目標，把能力用在真正想投入的方向。","未來有新的合作或發展機會，持續行動會帶來改變。"],學業:["過去的學習經驗已經替你打下重要基礎。","現在適合專注核心目標，找到自己的學習節奏。","未來會逐步看見成果，持續累積就是你的力量。"],健康:["過去的生活節奏可能讓你忽略休息與內在感受。","現在最重要的是重新找回平衡，照顧睡眠與日常節奏。","未來適合建立穩定習慣，慢慢累積身心力量。"],人格特質:["過去的經驗形成了你獨特的處事方式與能力。","現在需要更相信自己的直覺與判斷。","未來會越來越清楚自己的價值，並把特質化為力量。"]};let cat='',p=[];const $=x=>document.getElementById(x);function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active');scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;$('start').disabled=false});function deck(){let d=$('deck');d.innerHTML='';for(let i=0;i<22;i++){let b=document.createElement('button');b.className='card';let a=-48+i*96/21,x=(i-10.5)*30,y=Math.abs(i-10.5)*1.2;b.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${a}deg)`;b.style.zIndex=i;b.onclick=()=>pick(i,b);d.appendChild(b)}}function pick(i,b){if(p.includes(i)||p.length===3)return;p.push(i);b.classList.add('used');$('hint').textContent=p.length===1?'第 2 張代表「過去」':p.length===2?'第 3 張代表「未來」':'三張牌已選好，準備進入聖三角牌陣 ✦';$('next').disabled=p.length!==3}$('start').onclick=()=>{p=[];deck();$('next').disabled=true;show('draw')};$('next').onclick=()=>show('spread');$('finish').onclick=()=>{for(let i=0;i<3;i++){$('n'+i).textContent=cards[p[i]][0]+'・'+cards[p[i]][1];$('t'+i).textContent=tx[cat][i]}$('outcat').textContent='「'+cat+'」的聖三角指引';show('result')};$('close').onclick=()=>show('night');$('again').onclick=()=>{$('start').disabled=false;show('home')};$('tohome').onclick=()=>show('home');$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('已複製遊戲網址，快分享給朋友吧！')}catch(e){alert('請直接複製瀏覽器網址分享給朋友喔！')}};</script></body></html>
